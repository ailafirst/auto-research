# 容器版 Nginx —— 整份配置（不是 conf.d 片段），构建时覆盖镜像的
# /etc/nginx/nginx.conf，见 deployment/docker/Dockerfile 的 web 阶段。
#
# 前身是宿主机部署时的 deployment/templates/nginx.conf.template（已随 v0.2.2 的
# 容器化切换删除），差别只有两处：root 指向镜像内的静态资源目录而非宿主机项目路径，
# proxy_pass 指向 compose 服务名 api 而非 127.0.0.1。

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 容器 IP 会随重建变化，用 Docker 内置 DNS 并在变量里保存上游地址，
    # 这样 api 容器重建后 Nginx 不会因为启动时解析的旧 IP 而一直 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 研究任务本身是异步的，但 /progress 轮询和创建请求仍走这里
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health {
            set $upstream_health http://api:8000;
            proxy_pass $upstream_health;
            proxy_set_header Host $host;
        }
    }
}
