# Deep Research Agent 仅需 Python 环境运行，无需 Docker。
# 本文件保留用于后续部署场景。
services:
  # Redis 缓存（搜索 / embedding 缓存后端）
  # 启动: docker compose up -d redis
  # 然后在 .env 设置 REDIS_URL=redis://localhost:6379/0
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # 内存上限 + LRU 淘汰：embedding 向量量大时防止 Redis 涨爆
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

